# --- OmnySSH: графический SSH-менеджер (.deb из GitHub-релиза) --------------
# GUI-версия того же движка, что и TUI omny: подключения, вкладки, метрики,
# SFTP и проброс портов в одном окне. Артефакт релиза называется без версии —
# OmnySSH-x86_64.deb, поэтому тег последнего релиза берётся из редиректа
# releases/latest (см. tasks/omnyssh.yml).
omnyssh_install: true
omnyssh_repo: timhartmann7/omnyssh
omnyssh_deb_name: OmnySSH-x86_64.deb
omnyssh_deb_dir: "{{ tmp_dir }}/omnyssh"

# --- Sniffnet: графический TUI-анализатор сетевого трафика -----------------
# Ставится официальным .deb из GitHub-релиза (артефакт без версии в имени).
# Тег последнего релиза берётся из редиректа releases/latest.
sniffnet_install: true
sniffnet_repo: GyulyVGC/sniffnet
sniffnet_deb_name: Sniffnet_LinuxDEB_amd64.deb
sniffnet_deb_dir: "{{ tmp_dir }}/sniffnet"

# sshx — совместный терминал в браузере (мгновенный шаринг сессии). Релизных
# ассетов на GitHub нет: официальный install-скрипт качает sshx-<arch>-musl.tar.gz
# с S3 (адрес без версии — всегда актуальный). Поэтому ставится отдельной
# задачей sshx.yml, а не через роль binaries.
sshx_url: "https://s3.amazonaws.com/sshx/sshx-x86_64-unknown-linux-musl.tar.gz"

# --- DB-IP ASN Lite: офлайн-поиск ASN по IP (mmdblookup) -------------------
# Бесплатная MMDB-база по ASN (CC BY 4.0) без ключа и регистрации: закрывает
# офлайн-поиск там, где asnmap требует ключ PDCP, ipinfo — токен для полей
# ASN, а asn-tools — сборку из исходников. Читает базу mmdblookup из пакета
# mmdb-bin (network_packages).
#
# У апстрима имя файла содержит год и месяц (dbip-asn-lite-YYYY-MM.mmdb.gz),
# стабильного «latest» нет. Поэтому база хранится за текущий месяц, прошлые
# версии удаляются, а стабильный путь — симлинк dbip-asn-lite.mmdb на текущую
# базу. Свежая база скачивается при первом прогоне в новом месяце.
network_dbip_asn_install: true
network_dbip_asn_dir: /usr/share/GeoIP
network_dbip_asn_month: "{{ ansible_date_time.year }}-{{ '%02d' | format(ansible_date_time.month | int) }}"
network_dbip_asn_file: "{{ network_dbip_asn_dir }}/dbip-asn-lite-{{ network_dbip_asn_month }}.mmdb"
network_dbip_asn_link: "{{ network_dbip_asn_dir }}/dbip-asn-lite.mmdb"
network_dbip_asn_url: "https://download.db-ip.com/free/dbip-asn-lite-{{ network_dbip_asn_month }}.mmdb.gz"

# --- curl-impersonate: curl с браузерным TLS-отпечатком --------------------
# Статический бинарник curl-impersonate (собран на BoringSSL) плюс обёртки
# curl_chrome152, curl_firefox155 и т.д.: ClientHello, шифры, кривые, порядок
# расширений, приоритеты HTTP/2 и заголовки совпадают с браузером. Нужен,
# когда сайт отсекает обычный curl по JA3/JA4, а браузерная автоматизация
# избыточна.
#
# Ставится отдельной задачей (tasks/curl-impersonate.yml), а не ролью binaries:
# в релизном тарболле кроме бинарника лежат обёртки curl_chrome*/curl_firefox*,
# а binaries ставит из архива только один member. Обёртка — это sh-скрипт,
# запускающий «$dir/curl-impersonate --impersonate <профиль>», поэтому бинарник
# и скрипты должны лежать в одном каталоге (bin_dir). Репозиторий — активный
# форк lexiforest, оригинал lwthiker/curl-impersonate заброшен.
network_curl_impersonate_install: true
network_curl_impersonate_repo: lexiforest/curl-impersonate

# bandwhich для чтения сетевого трафика требует CAP_NET_RAW — вешаем setcap
# на бинарник, чтобы он работал без sudo. False = не навешивать (запуск через sudo).
network_bandwhich_setcap: true

# ttl шлёт пробы через raw-сокет и без CAP_NET_RAW требует sudo. setcap на
# бинарник снимает это требование. False = запуск через sudo.
network_ttl_setcap: true

# rustnet читает пакеты через libpcap, а владельца соединения ищет через eBPF:
# нужны CAP_NET_RAW, CAP_BPF и CAP_PERFMON. setcap позволяет запускать TUI
# без sudo (иначе — `sudo rustnet`). False = не навешивать.
network_rustnet_setcap: true

# sx сканирует raw-пакетами (SYN/FIN/NULL/Xmas, ICMP, ARP/NDP) и без
# CAP_NET_RAW требует sudo. setcap снимает это требование.
# False = запускать `sudo sx`.
network_sx_setcap: true

# naabu в SYN-режиме (по умолчанию) работает через raw-сокет и без
# CAP_NET_RAW требует sudo; connect-режим (`-s connect`) работает и так.
# setcap снимает это требование. False = запускать `sudo naabu`.
network_naabu_setcap: true

# --- NetBird: mesh VPN на WireGuard ----------------------------------------
# Официальный apt-репозиторий (https://pkgs.netbird.io), не PPA: апстрим
# публикует ключ и пакеты `netbird` (CLI + демон) и `netbird-ui` (GUI на
# GTK4/WebKit). PPA у проекта нет.
#
# Ключ кладём как ASCII-armored .asc и подключаем через signed-by — как у
# Docker, поэтому gnupg не нужен. Пакет netbird-ui требует GTK 4.14+ и
# WebKitGTK 6.0; в Ubuntu 26.04 они есть, зависимости подтянет apt.
#
# Файл sources`netbird_repo_file`.list плейбук перезаписывает целиком: apt
# падает с «Conflicting values set for option Signed-By», если в нём осталась
# запись с другим ключом (например, от ручной установки по инструкции NetBird
# с ключом netbird-archive-keyring.gpg).
netbird_install: true
netbird_repo_url: https://pkgs.netbird.io/debian
netbird_repo_suite: stable
netbird_repo_component: main
netbird_repo_file: netbird
netbird_key_url: https://pkgs.netbird.io/debian/public.key
netbird_key_path: /usr/share/keyrings/netbird-archive-keyring.asc
netbird_packages:
  - netbird
  - netbird-ui
netbird_service: netbird.service
