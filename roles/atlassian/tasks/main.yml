---
# ============================================================================
# Роль atlassian: jira-cli (бинарник из GitHub-релиза), jiratui и
# mcp-atlassian (pipx).
# ============================================================================

- name: "Установить jira-cli (Jira CLI: задачи, JQL и комментарии)"
  ansible.builtin.include_role:
    name: binaries
  vars:
    binaries_to_install: "{{ atlassian_binaries }}"

- name: Установить Python-клиенты Jira и Confluence (jiratui, mcp-atlassian)
  ansible.builtin.include_role:
    name: pipx_apps
  vars:
    pipx_apps: "{{ atlassian_pipx_apps }}"
