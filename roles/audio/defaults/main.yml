---
# ============================================================================
# Роль audio: аудиоприложения для ноутбука.
#
# 1. HushMic — шумоподавление микрофона реального времени. Добавляет в PipeWire
#    виртуальный микрофон, который на лету убирает шум клавиатуры, вентиляторов
#    и фоновые голоса (модель DPDFNet). В приложениях (Discord, OBS, браузер)
#    выбирается устройство ввода «HushMic».
# 2. Яндекс Музыка RS (yamusic-rs) — неофициальный десктопный клиент Яндекс
#    Музыки на Rust/Slint вместо Electron: один бинарник и ~65 МБ памяти.
#
# Оба ставятся официальными .deb-пакетами из GitHub-релизов. Версии не
# фиксируются: тег последнего релиза берётся из HTTP-редиректа releases/latest
# (без GitHub API).
#
# Идемпотентность: HushMic пропускается, если /usr/bin/hushmic уже есть;
# yamusic-rs сверяет версию пакета в dpkg с релизной (роль github_deb).
# ============================================================================

# --- Пакеты, нужные HushMic (PipeWire + WirePlumber) ------------------------
audio_packages:
  - pipewire
  - pipewire-bin
  - pipewire-pulse
  - wireplumber
  - hicolor-icon-theme

audio_repo: Fovty/HushMic

audio_deb_dir: "{{ tmp_dir }}/hushmic"

# --- Яндекс Музыка RS (yamusic-rs) ------------------------------------------
# Linux-сборка в бете: нужна glibc 2.35+ (Ubuntu 22.04 и новее), звук через
# PipeWire/PulseAudio/ALSA, медиаклавиши через MPRIS. Пакет приносит
# /usr/bin/yamusic-rs, .desktop и иконки — приложение появляется в меню.
# Asset в релизе называется yamusic-rs_<версия>-1_amd64.deb: подпись {version}
# github_deb заменяет на тег без ведущего v (v1.1.4 -> 1.1.4).
yamusic_repo: SpolzerMod/yamusic-rs
yamusic_github_debs:
  - pkg: yamusic-rs
    repo: "{{ yamusic_repo }}"
    asset: yamusic-rs_{version}-1_amd64.deb
    install: true
