---
# ============================================================================
# Роль monitoring: локальные утилиты мониторинга и проверки алерт-правил
# (vmalert-tool, vlogscli, sloth, cloudprober, canary-checker, kula, gdg,
# promformat).
# ============================================================================

- name: Установить vmalert-tool (актуальная версия)
  ansible.builtin.include_role:
    name: binaries
  vars:
    binaries_to_install: "{{ monitoring_binaries }}"

- name: Установить Python-приложения мониторинга (promformat)
  ansible.builtin.include_role:
    name: pipx_apps
  vars:
    pipx_apps: "{{ monitoring_pipx_apps }}"

- name: Установить krr (рекомендации requests/limits)
  ansible.builtin.include_tasks:
    file: krr.yml
  when: krr_install
