---
# ============================================================================
# helm-unittest — плагин `helm unittest`: unit-тесты Helm-чартов, описанные на
# YAML (suite/templates/tests/asserts). Чарт рендерится локально, в кластере
# ничего не создаётся. Есть снапшот-тесты и `--coverage`.
#
# Роль binaries не подходит: ставится helm-плагин, а не бинарник в bin_dir.
# Версия берётся из редиректа releases/latest (без GitHub API), установка —
# `helm plugin install ... --version`. Идемпотентность: есть каталог плагина —
# ничего не делаем. Обновить = удалить каталог плагина и запустить плейбук.
# ============================================================================

- name: Проверить, установлен ли плагин helm-unittest
  ansible.builtin.stat:
    path: "{{ helm_unittest_plugin_dir }}"
  register: helm_unittest_stat

- name: Узнать актуальную версию helm-unittest
  ansible.builtin.uri:
    url: "https://github.com/{{ helm_unittest_repo }}/releases/latest"
    follow_redirects: all
    status_code: [200]
    headers:
      User-Agent: "{{ http_user_agent }}"
  register: helm_unittest_release
  changed_when: false
  when: not helm_unittest_stat.stat.exists

- name: Узнать версию helm (у helm 4 другой режим проверки плагинов)
  ansible.builtin.command:
    cmd: "{{ bin_dir }}/helm version --short"
  register: helm_unittest_helm_version
  changed_when: false
  when: not helm_unittest_stat.stat.exists

- name: Установить плагин helm-unittest
  ansible.builtin.command:
    cmd: >-
      {{ bin_dir }}/helm plugin install
      https://github.com/{{ helm_unittest_repo }}
      --version {{ helm_unittest_release.url | regex_replace('^.*/releases/tag/', '') }}
      {{ '--verify=false' if helm_unittest_helm_version.stdout is version('v4.0.0', '>=') else '' }}
  when: not helm_unittest_stat.stat.exists
  changed_when: true
# --verify=false нужен только для helm 4: он требует явно отключить проверку
# подписи для плагинов, которые ставятся напрямую из git. Helm 3 флага не
# знает, поэтому он подставляется по major-версии (как в helm-diff).
