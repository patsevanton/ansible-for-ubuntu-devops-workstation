---
# ============================================================================
# rust-analyzer: LSP-сервер для Rust.
#
# В apt его нет, поэтому ставим официальный релизный бинарник. GitHub отдаёт
# файл как одиночный .gz (не tar), поэтому скачиваем и распаковываем gunzip.
# Обновление — удалить {{ bin_dir }}/rust-analyzer и прогнать плейбук снова:
# версия не фиксируется, URL ведёт на последний релиз.
# ============================================================================

- name: Проверить наличие rust-analyzer
  ansible.builtin.stat:
    path: "{{ bin_dir }}/rust-analyzer"
  register: rust_analyzer_stat

- name: Скачать rust-analyzer
  become: true
  ansible.builtin.get_url:
    url: "{{ runtimes_rust_analyzer_url }}"
    dest: "{{ bin_dir }}/rust-analyzer.gz"
    mode: "0644"
  when:
    - runtimes_rust_analyzer_install
    - not rust_analyzer_stat.stat.exists

- name: Распаковать rust-analyzer
  become: true
  ansible.builtin.command:
    cmd: "gunzip -f {{ bin_dir }}/rust-analyzer.gz"
    creates: "{{ bin_dir }}/rust-analyzer"
  when:
    - runtimes_rust_analyzer_install
    - not rust_analyzer_stat.stat.exists

- name: Выставить права на rust-analyzer
  become: true
  ansible.builtin.file:
    path: "{{ bin_dir }}/rust-analyzer"
    mode: "0755"
  when:
    - runtimes_rust_analyzer_install
    - not rust_analyzer_stat.stat.exists
