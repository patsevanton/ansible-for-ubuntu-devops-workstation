---
# Секреты и управление окружением.
# direnv — окружение по каталогам, vault — секреты.
secrets_packages:
  - direnv
  # age — простое современное шифрование файлов; бэкенд для sops (ставится ниже).
  # Пакет из репозитория Ubuntu, отдельной роли не требует.
  - age
  # lynis — аудит безопасности и харденинга Linux: проверяет настройки ОС, SSH
  # и сервисов, печатает предупреждения и рекомендации по устранению.
  - lynis
  # govulncheck — Go reachability-анализ: показывает только уязвимости в
  # символах, которые проект реально вызывает. Дополняет osv-scanner: тот
  # находит все уязвимые зависимости, govulncheck отсекает невызываемый код.
  - govulncheck

secrets_binaries:
  - name: vault
    source: github
    repo: hashicorp/vault
    url: "https://releases.hashicorp.com/vault/{version}/vault_{version}_linux_amd64.zip"
    archive: zip
    member: vault
  - name: gitleaks
    source: github
    repo: gitleaks/gitleaks
    url: "https://github.com/gitleaks/gitleaks/releases/download/{tag}/gitleaks_{version}_linux_x64.tar.gz"
    archive: tar
    member: gitleaks
  # sops — шифрование секретов прямо в Git (KMS/age/PGP). Дополняет vault:
  # vault хранит секреты централизованно, sops — шифрует их на месте в репозитории.
  # Релиз — одиночный статический бинарник sops-v{version}.linux.amd64 (без архива).
  - name: sops
    source: github
    repo: getsops/sops
    url: "https://github.com/getsops/sops/releases/download/{tag}/sops-v{version}.linux.amd64"
    archive: none
  # grype — сканер уязвимостей контейнерных образов и файловой системы.
  - name: grype
    source: github
    repo: anchore/grype
    url: "https://github.com/anchore/grype/releases/download/{tag}/grype_{version}_linux_amd64.tar.gz"
    archive: tar
    member: grype
  # mfa — терминальный менеджер 2FA/TOTP: хранение секретов в зашифрованном
  # виде, генерация кодов и импорт из других приложений. Релиз — тарболл
  # mfa_{version}_linux_amd64.tar.gz, бинарник mfa в корне.
  - name: mfa
    source: github
    repo: LexSerest/mfa
    url: "https://github.com/LexSerest/mfa/releases/download/{tag}/mfa_{version}_linux_amd64.tar.gz"
    archive: tar
    member: mfa
  # medusa — импорт/экспорт секретов HashiCorp Vault: забирает секреты по
  # указанным путям и раскладывает их по типам (env-файлы, JSON, YAML),
  # умеет заливать обратно. Релиз — medusa_{version}_linux_amd64.tar.gz,
  # бинарник medusa в корне.
  - name: medusa
    source: github
    repo: jonasvinther/medusa
    url: "https://github.com/jonasvinther/medusa/releases/download/{tag}/medusa_{version}_linux_amd64.tar.gz"
    archive: tar
    member: medusa
  # bank-vaults — «швейцарский нож» для HashiCorp Vault: инициализация,
  # автоматический unseal, конфигурация через YAML (политики, auth-методы,
  # секреты) и ротация. Дополняет vault (разовые команды) и medusa
  # (импорт/экспорт). Релиз — bank-vaults_{version}_Linux_x86_64.tar.gz,
  # бинарник bank-vaults в корне.
  - name: bank-vaults
    source: github
    repo: bank-vaults/bank-vaults
    url: "https://github.com/bank-vaults/bank-vaults/releases/download/{tag}/bank-vaults_{version}_Linux_x86_64.tar.gz"
    archive: tar
    member: bank-vaults
  # horusec — SAST-сканер уязвимостей одной командой: находит проблемы в
  # коде (Go, Python, JS/TS, Java, Ruby и др.) без настройки правил.
  # Одиночный бинарник horusec_linux_amd64 без версии в имени.
  - name: horusec
    source: github
    repo: ZupIT/horusec
    url: "https://github.com/ZupIT/horusec/releases/download/{tag}/horusec_linux_amd64"
    archive: none
  # opengrep — SAST на правилах, форк Semgrep CE под LGPL-2.1: taint-анализ
  # (источник → сток), правила под 30+ языков, обмен правилами с Semgrep.
  # Локальная замена серверному GSC (см. TODO-server-apps.md в
  # ansible-for-ubuntu-llm-agent-server): находит те же
  # классы проблем, но не генерирует PoC и не проверяет фиксы.
  # Одиночный бинарник opengrep_manylinux_x86 (glibc, зависимостей нет; вариант
  # musllinux — для Alpine), без версии в имени.
  - name: opengrep
    source: github
    repo: opengrep/opengrep
    url: "https://github.com/opengrep/opengrep/releases/download/{tag}/opengrep_manylinux_x86"
    archive: none
  # osv-scanner — SCA по lockfile (Cargo, npm, pip, Go, Maven, Composer и др.)
  # с базой OSV: один проход находит уязвимые зависимости во всех экосистемах.
  # Умеет SARIF/JSON и `--call-analysis=rust|go` — отсекает уязвимости в
  # невызываемом коде. Дополняет dependency-check (NVD) и ochrona (Python).
  # Одиночный бинарник osv-scanner_linux_amd64 без версии в имени.
  - name: osv-scanner
    source: github
    repo: google/osv-scanner
    url: "https://github.com/google/osv-scanner/releases/download/{tag}/osv-scanner_linux_amd64"
    archive: none
  # cargo-deny — проверка Rust-зависимостей по RustSec: уязвимости, лицензии,
  # запрещённые и дублирующиеся крейты, источники. Все advisory об
  # уязвимостях считаются ошибкой (severity-threshold в cargo-deny убрали).
  # Готовый musl-бинарник, компилятор не нужен; дополняет osv-scanner.
  - name: cargo-deny
    source: github
    repo: EmbarkStudios/cargo-deny
    url: "https://github.com/EmbarkStudios/cargo-deny/releases/download/{tag}/cargo-deny-{version}-x86_64-unknown-linux-musl.tar.gz"
    archive: tar
    member: cargo-deny-{version}-x86_64-unknown-linux-musl/cargo-deny
  # trufflehog — поиск секретов в git-истории, файлах, образах и S3 с
  # ПРОВЕРКОЙ найденного: ключ считается живым только если сработал на API
  # провайдера, поэтому ложных срабатываний почти нет. Дополняет gitleaks
  # (тот ищет по шаблонам, без проверки). Бинарник trufflehog в корне
  # тарболла trufflehog_{version}_linux_amd64.tar.gz.
  - name: trufflehog
    source: github
    repo: trufflesecurity/trufflehog
    url: "https://github.com/trufflesecurity/trufflehog/releases/download/{tag}/trufflehog_{version}_linux_amd64.tar.gz"
    archive: tar
    member: trufflehog
  # syft — генерация SBOM (CycloneDX/SPDX) из образов, каталогов и архивов:
  # показывает пакеты и версии. Пара к grype — тот сканирует по своей базе,
  # а syft даёт SBOM, который можно хранить и проверять отдельно.
  # Бинарник syft в корне тарболла syft_{version}_linux_amd64.tar.gz.
  - name: syft
    source: github
    repo: anchore/syft
    url: "https://github.com/anchore/syft/releases/download/{tag}/syft_{version}_linux_amd64.tar.gz"
    archive: tar
    member: syft
  # cosign — подпись и проверка артефактов по sigstore: `cosign verify`,
  # подписи образов и SBOM в реестре вместе с attestations. Одиночный
  # бинарник cosign-linux-amd64 без версии в имени.
  - name: cosign
    source: github
    repo: sigstore/cosign
    url: "https://github.com/sigstore/cosign/releases/download/{tag}/cosign-linux-amd64"
    archive: none
  # trivy — универсальный сканер: уязвимости образов, файловых систем и
  # репозиториев, мисконфиги IaC (Terraform, Kubernetes, Dockerfile) и
  # секреты в коде, плюс генерация SBOM. Дополняет grype: тот про CVE в
  # образах, trivy закрывает ещё IaC и секреты. Бинарник trivy в корне
  # тарболла trivy_{version}_Linux-64bit.tar.gz.
  - name: trivy
    source: github
    repo: aquasecurity/trivy
    url: "https://github.com/aquasecurity/trivy/releases/download/{tag}/trivy_{version}_Linux-64bit.tar.gz"
    archive: tar
    member: trivy
  # landrun — sandbox для одной команды на Landlock: ограничивает файловую
  # систему и сеть без root, контейнеров и AppArmor. Одиночный бинарник
  # landrun-linux-amd64 без версии в имени.
  - name: landrun
    source: github
    repo: Zouuup/landrun
    url: "https://github.com/Zouuup/landrun/releases/download/{tag}/landrun-linux-amd64"
    archive: none
  # subfinder — пассивный поиск поддоменов по публичным источникам
  # (Certificate Transparency, DNS-дампы, поисковики), без запросов к самому
  # домену. Дополняет nmap (активное сканирование) и nuclei (проверка
  # найденного): subfinder только собирает список хостов.
  # Релиз — zip с бинарником subfinder в корне.
  - name: subfinder
    source: github
    repo: projectdiscovery/subfinder
    url: "https://github.com/projectdiscovery/subfinder/releases/download/{tag}/subfinder_{version}_linux_amd64.zip"
    archive: zip
    member: subfinder
  # gitjacker — выкачивает git-репозиторий с сайта, где случайно оставили
  # доступным каталог `.git`, и восстанавливает исходники даже при выключенном
  # листинге каталогов (перебирает объекты и refs). Нужен для проверки своих
  # стендов и пентеста: subfinder/nmap находят хосты и порты, gitjacker
  # показывает, что именно утекло. Требует git в PATH (роль base).
  # Только для своих сайтов и разрешённого пентеста.
  # Релиз — одиночный бинарник gitjacker-linux-amd64 (без версии в имени).
  - name: gitjacker
    source: github
    repo: liamg/gitjacker
    url: "https://github.com/liamg/gitjacker/releases/download/{tag}/gitjacker-linux-amd64"
    archive: none
  # gosec — SAST для Go: правила G101 (захардкоженные секреты), G304
  # (путь из недоверенного ввода в file open), G404 (math/rand для
  # безопасности), G107/G110 (SSRF и открытые редиректы) и ещё десятки
  # проверок. Дополняет govulncheck (тот смотрит только зависимости) и
  # opengrep (общие taint-правила без знания Go API): gosec проверяет именно
  # идиомы и stdlib Go. Отчёт в JSON/SARIF: `gosec -fmt sarif -out gosec.sarif ./...`.
  # Релиз — tar.gz с бинарником gosec в корне.
  - name: gosec
    source: github
    repo: securego/gosec
    url: "https://github.com/securego/gosec/releases/download/{tag}/gosec_{version}_linux_amd64.tar.gz"
    archive: tar
    member: gosec
  # dotenvx — шифрование .env по публичному ключу и запуск команды с
  # расшифрованными переменными: `dotenvx encrypt`, `dotenvx run -- npm start`.
  # Дополняет sops: тот требует ключ (age/KMS), конфиг .sops.yaml и работает
  # с любым YAML/JSON, а dotenvx разбирается именно с обычным .env, который
  # используют Node- и Python-приложения, и не меняет формат файла для кода.
  # Релиз — tar.gz с бинарником dotenvx в корне.
  - name: dotenvx
    source: github
    repo: dotenvx/dotenvx
    url: "https://github.com/dotenvx/dotenvx/releases/download/{tag}/dotenvx-{version}-linux-amd64.tar.gz"
    archive: tar
    member: dotenvx
  # betterleaks — сканер секретов от авторов gitleaks: ранжирует находки по
  # уверенности, проверке и severity, проверяет ключи HTTP-запросами из
  # правила и определяет права найденной учётной записи. Дополняет gitleaks
  # (шаблоны без проверки) и trufflehog (live-проверка): betterleaks
  # приоритизирует находки и сканирует ещё контейнеры, GitHub/GitLab, S3 и
  # Hugging Face. Релиз — betterleaks_{version}_linux_x64.tar.gz, бинарник
  # betterleaks в корне.
  - name: betterleaks
    source: github
    repo: betterleaks/betterleaks
    url: "https://github.com/betterleaks/betterleaks/releases/download/{tag}/betterleaks_{version}_linux_x64.tar.gz"
    archive: tar
    member: betterleaks

# --- dependency-check: OWASP SCA ---------------------------------------------
# Проверяет зависимости проекта (Maven/Gradle/npm/pip/composer и др.) на
# известные CVE по базе NVD. Апстрим публикует только zip-архив
# dependency-check-<ver>-release.zip (Java-приложение + jar-файлы), поэтому
# ставим его не через роль binaries: распаковываем в /opt/dependency-check,
# в bin_dir кладём обёртку. Обёртка добавляет --data в пользовательский
# кэш XDG: каталог data/ в /opt принадлежит root, и обновление NVD обычным
# пользователем иначе падало бы с «Permission denied».
dependency_check_install: true
dependency_check_repo: dependency-check/DependencyCheck
dependency_check_dir: /opt/dependency-check
dependency_check_bin: "{{ bin_dir }}/dependency-check"
dependency_check_zip_dir: "{{ tmp_dir }}/dependency-check"

# Go-приложения без релизных бинарников — собираются ролью go_apps.
secrets_go_apps:
  # entropy — ищет в кодовой базе строки с высокой энтропией (ключи, токены,
  # пароли): рекурсивно обходит файлы, отбрасывает алфавиты/URL/base64-картинки
  # и показывает топ подозрительных строк. Дополняет gitleaks: тот работает по
  # шаблонам известных форматов, entropy — по самому признаку случайности.
  - name: entropy
    package: github.com/EwenQuim/entropy

# Python-приложения роли secrets — ставятся через pipx в изолированное окружение.
secrets_pipx_apps:
  # ochrona — SCA-сканер Python-зависимостей: читает requirements.txt/Pipfile/
  # poetry.lock, сверяет версии с базой уязвимостей OSV и предлагает безопасные
  # версии; умеет блокировать установку небезопасного пакета. Дополняет
  # dependency-check (тот про Maven/Gradle/npm и базу NVD) и grype (образы).
  # Пакет на PyPI называется ochrona, команда — ochrona.
  - name: ochrona
    creates: ochrona

# --- osquery: SQL-подобная инструментация ОС ---------------------------------
# Ставится официальным .deb из GitHub-релиза (бинарники osqueryd/osqueryi/
# osqueryctl в /opt/osquery/bin с симлинками в /usr/bin + systemd-юнит).
# Сам сервис не трогаем: он без osquery.conf не запускается, поэтому дефолтов
# не ломаем и в автозагрузку не добавляем — осознанный дефолт.
# Версия берётся из редиректа releases/latest; имя артефакта — osquery_<ver>-1.linux_amd64.deb.
osquery_install: true
osquery_repo: osquery/osquery
osquery_deb_dir: "{{ tmp_dir }}/osquery"
