---
# Перезапуск сервиса после изменения compose- или unit-файла: даём systemd
# подхватить новое содержимое и поднимаем контейнеры заново.
- name: Перезапустить excalidraw
  become: true
  ansible.builtin.systemd_service:
    name: "{{ excalidraw_service_name }}.service"
    state: restarted
    daemon_reload: true
