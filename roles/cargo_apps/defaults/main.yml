---
# ============================================================================
# Роль cargo_apps — установка Rust-приложений из crates.io командой
# `cargo install <crate>`.
#
# Нужна для инструментов, которые публикуются только на crates.io: готовых
# релизных бинарников нет, поэтому собираем из исходников тем же cargo,
# который ставит роль runtimes (пакеты rustc/cargo). Поэтому роль вызывается
# только из ролей, идущих в плейбуке после runtimes.
#
# Роль не тянет конкретные приложения сама: её вызывают другие роли через
# include_role и передают список cargo_apps. Поля элемента:
#
#   name  — имя файла бинарника в {{ bin_dir }} (как называется команда);
#   crate — имя пакета на crates.io.
#
# Идемпотентность: бинарник ставится, только если его нет в bin_dir.
# Версия не фиксируется: cargo install без --version берёт последнюю
# опубликованную версию крейта.
# ============================================================================

# Список задаёт вызывающая роль; значение по умолчанию — пустой список.
cargo_apps: []

# cargo — системный бинарник из пакета cargo (роль runtimes).
cargo_executable: /usr/bin/cargo

# --root /usr/local кладёт бинарники в /usr/local/bin, то есть ровно в bin_dir,
# а не в /root/.cargo/bin (роль работает с become).
cargo_apps_install_root: /usr/local

# Реестр и кэш сборки держим в tmp_dir: иначе root-овский cargo осел бы в
# /root/.cargo и /root/.rustup.
cargo_apps_home_dir: "{{ tmp_dir }}/cargo-home"
cargo_apps_target_dir: "{{ tmp_dir }}/cargo-target"
