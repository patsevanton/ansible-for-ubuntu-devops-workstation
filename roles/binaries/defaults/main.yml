---
# ============================================================================
# Роль binaries — движок установки бинарников в {{ bin_dir }}.
#
# Роль не тянет конкретные инструменты сама: её вызывают другие роли
# (kubernetes, iac, secrets, shell) через include_role и передают список
# binaries_to_install. Поля элемента списка:
#
#   name          — имя файла в {{ bin_dir }}
#   source        — github | gitlab | text
#   repo          — owner/repo на GitHub (source=github) или путь проекта
#                   в группе на GitLab, напр. gitlab-org/cli (source=gitlab)
#   version       — необязательный тег релиза (напр. v0.8.0): ставится ровно
#                   он, /releases/latest не запрашивается. Нужен, когда
#                   последний релиз вышел без бинарников (inframap v0.8.1)
#   version_url   — URL, отдающий версию текстом (source=text)
#   version_strip — regex, срезающий префикс тега (по умолчанию ^v)
#   url           — шаблон ссылки на файл; подставляются {tag} и {version}
#   archive       — none | tar | tarxz | tarbz2 | zip | gz
#                   gz — одиночный файл, сжатый gzip (не тарболл): после
#                   скачивания разворачивается gunzip'ом, member не нужен
#   member        — путь к бинарнику внутри архива (можно {tag} и {version})
#
# Идемпотентность: бинарник ставится, только если его нет в bin_dir.
# Удалить файл = переустановить при следующем запуске.
#
# Обновление: -e app_update=true заставляет роль проверить все
# бинарники из переданного списка (а не только отсутствующие), сравнить
# актуальный тег с тегом в binaries_state_file и переустановить только
# отличающиеся. Первый такой запуск после появления state-файла
# переустановит всё: версии уже стоящих бинарников неизвестны, пока роль
# сама их не записала.
#
# Версия определяется без GitHub API (у него лимит 60 запросов в час):
#   source=github -> тег последнего релиза берётся из HTTP-редиректа
#                    https://github.com/<repo>/releases/latest
#   source=gitlab -> тег последнего релиза берётся из HTTP-редиректа
#                    https://gitlab.com/<repo>/-/releases/permalink/latest
#   source=text   -> версия читается из текстового endpoint'а
#                    (dl.k8s.io/release/stable.txt, get.helm.sh/...)
# ============================================================================

# Список задаёт вызывающая роль; значение по умолчанию — пустой список.
binaries_to_install: []

# Флаг режима обновления app_update объявлен в group_vars/all.yml: его
# читают и роли, которые binaries не вызывают (opencode), а defaults роли,
# подключённой через include_role, видны только её собственным задачам.

# Расширения архивов по значению поля archive (используются в именах
# скачанных файлов во временном каталоге).
binaries_archive_extensions:
  none: ""
  tar: tar.gz
  tarxz: tar.xz
  tarbz2: tar.bz2
  zip: zip
  gz: gz
