---
# ============================================================================
# Роль markdown: десктопные редакторы Markdown (Zettlr, MarkText) и CLI-
# конвертеры PDF ↔ Markdown (pdf2md, pdfcli).
#
# Zettlr — редактор для научных текстов и заметок: Zettelkasten, ссылки,
# цитаты, экспорт в PDF/LaTeX/DOCX. MarkText — минималистичный WYSIWYG-
# редактор в духе Typora.
#
# Ставятся официальными .deb из GitHub-релизов. Тег последнего релиза берётся
# из HTTP-редиректа releases/latest (без GitHub API — у него лимит 60 запросов
# в час), версия — тег без префикса v. Зависимости (GTK, NSS, libsecret,
# libasound2t64 и т.п.) подтягивает apt из репозитория Ubuntu.
#
# Идемпотентность: если /usr/bin/<name> уже есть, приложение не трогаем.
# Обновление — удалить пакет и запустить плейбук снова.
# ============================================================================

# Каталог для скачанных .deb; после установки удаляется.
markdown_deb_dir: "{{ tmp_dir }}/markdown"

# Архитектура в именах релизных ассетов: x86_64 -> amd64, aarch64 -> arm64.
markdown_arch: "{{ ansible_facts['architecture'] }}"
markdown_arch_names:
  x86_64: amd64
  aarch64: arm64

# Каталог приложений: имя = имя бинарника в /usr/bin.
# deb — шаблон имени ассета; плейсхолдер {version} заменяется в install.yml
# после запроса последнего релиза. Jinja-переменную здесь использовать нельзя:
# include_tasks рендерит элементы loop заранее, когда версия ещё неизвестна.
markdown_apps:
  - name: zettlr
    repo: Zettlr/Zettlr
    bin: /usr/bin/zettlr
    deb: "Zettlr-{version}-{{ markdown_arch_names[markdown_arch] }}.deb"
  # У MarkText в x86_64-ассете нет суффикса архитектуры: marktext-linux-0.23.0.deb,
  # у arm64 — marktext-linux-arm64-0.23.0.deb.
  - name: marktext
    repo: marktext/marktext
    bin: /usr/bin/marktext
    deb: >-
      marktext-linux-{{ 'arm64-' if markdown_arch == 'aarch64' else '' }}{version}.deb

# --- CLI: PDF → Markdown и обратно -------------------------------------------
# pdf2md — конвертер PDF в Markdown на Rust. Разбирает структуру документа без
# внешних бинарников: заголовки, списки, таблицы; умеет ONNX-layout detection
# и OCR (модели докачивает при первом запуске). Релиз — тарболл
# pdf2md_{version}_linux_x86_64.tar.gz (arm64 — суффикс arm64), бинарник
# pdf2md в корне. Ставится ролью binaries, как остальные CLI-утилиты.
markdown_pdf_arch: "{{ 'arm64' if markdown_arch == 'aarch64' else 'x86_64' }}"
markdown_binaries:
  - name: pdf2md
    source: github
    repo: fjacquet/pdf2md
    url: >-
      https://github.com/fjacquet/pdf2md/releases/download/{tag}/pdf2md_{version}_linux_{{ markdown_pdf_arch }}.tar.gz
    archive: tar
    member: pdf2md

# pdfcli — CLI пакета pdfrs с crates.io: PDF → Markdown, Markdown → PDF,
# merge/split/rotate/watermark, извлечение текста, поиск и редактура. Чистый
# Rust, без Poppler/PDFium/LaTeX. Релизов на GitHub нет, поэтому ставится
# ролью cargo_apps (сборка из исходников). Имя бинарника — pdfcli, не pdfrs.
markdown_cargo_apps:
  - name: pdfcli
    crate: pdfrs
