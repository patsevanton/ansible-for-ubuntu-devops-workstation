# --- Быстрая таблица для индекса ------------------------------------------
# Не больше ~20 строк: это то, что агент читает первым. Полные списки —
# в категориях. Инструмент в `tool` должен реально стоять на машине.
toolbox_quick:
  - {task: поиск по коду, tool: "rg, ast-grep", instead: "grep -r"}
  - {task: поиск файлов, tool: "fdfind", instead: find}
  - {task: ресурсы и процессы, tool: "btop, procs, smem", instead: "top, ps"}
  - {task: JSON, tool: "jq, jnv, fx", instead: "python -m json.tool"}
  - {task: YAML и TOML, tool: "yq, dasel, taplo", instead: "ручной разбор"}
  - {task: JSON-логи, tool: "hl, lnav", instead: "grep + awk"}
  - {task: агрегаты по потоку логов, tool: "agrind, sig", instead: "awk + sort | uniq -c"}
  - {task: SQL по CSV и Parquet, tool: "duckdb", instead: "python + pandas"}
  - {task: Kubernetes, tool: "kubectl, stern, k9s", instead: "ssh на узел"}
  - {task: манифесты Kubernetes, tool: "kubectl-neat, kubeconform, kube-linter", instead: "чтение живого YAML"}
  - {task: Terraform, tool: "terraform, tflint, terraform-docs", instead: "ручная проверка"}
  - {task: HTTP, tool: "xh, httpie", instead: "curl -v"}
  - {task: DNS и TLS, tool: "doggo, testssl.sh, showcert", instead: "openssl s_client вручную"}
  - {task: diff, tool: "difft, delta", instead: diff}
  - {task: поиск секретов, tool: "gitleaks, trufflehog", instead: "grep по токенам"}
  - {task: PostgreSQL, tool: "pgcli, rainfrog", instead: "psql без подсветки"}
  - {task: PDF и Office, tool: "pdftotext, catdoc", instead: "копирование вручную"}
  - {task: версии рантаймов, tool: "mise", instead: "ручная установка"}
  - {task: MCP-серверы, tool: "mcpc", instead: "свой клиент на Python"}
