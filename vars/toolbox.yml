---
# ============================================================================
# Каталог инструментов для AI-агентов (opencode).
#
# Здесь только метаданные: как разложить установленные утилиты по задачам,
# чтобы агент находил нужную команду. Список самих утилит не дублируется —
# имена и описания берутся из README.md, версии и факт установки — из
# ~/.local/state/devops-playbook/report.json.
#
# Файлы читает scripts/toolbox.py (вызывается из post_tasks playbook.yml):
#   ~/.local/state/devops-playbook/toolbox.json  — машиночитаемый каталог;
#   ~/.config/opencode/docs/tools.md             — индекс для агента;
#   ~/.config/opencode/docs/tools/<domain>.md    — категории.
#
# Ansible-роль — это единица установки (тег, порядок), а домен — ось поиска
# для агента. Они не совпадают: роль shell ставит и поиск, и логи, и БД.
# Поэтому роль задаёт домен по умолчанию, а toolbox_overrides переносит
# отдельные утилиты в подходящий домен.
# ============================================================================

# --- Домены ----------------------------------------------------------------
# agent: false — домен не попадает в docs/tools.md: это GUI, железо и
# системная база, которой агент не пользуется. В toolbox.json записи
# остаются, чтобы каталог был полным.
toolbox_domains:
  - id: search-files
    title: Поиск, файлы, терминал
    description: поиск по коду и файлам, просмотр, навигация, shell-обвязка
    agent: true
  - id: system
    title: Система и производительность
    description: процессы, ресурсы, диски, трассировка, резервные копии
    agent: true
  - id: text-data
    title: Текст и данные
    description: JSON, YAML, TOML, CSV, SQL по файлам, преобразование текста
    agent: true
  - id: observability
    title: Логи, метрики, трассировки
    description: просмотр и агрегация логов, Prometheus, OpenTelemetry, eBPF
    agent: true
  - id: network
    title: Сеть и HTTP
    description: диагностика сети, DNS, TLS, HTTP-клиенты, туннели
    agent: true
  - id: kubernetes
    title: Kubernetes
    description: кластеры, манифесты, Helm, GitOps, рабочие нагрузки
    agent: true
  - id: kubernetes-debug
    title: Kubernetes — диагностика
    description: логи и exec в подах, отладка, ёмкость и стоимость
    agent: true
  - id: iac-cloud
    title: IaC и облако
    description: Terraform, Packer, линтеры, Ansible, облачные CLI
    agent: true
  - id: databases
    title: Базы данных
    description: PostgreSQL, ClickHouse, Kafka, универсальные SQL-клиенты
    agent: true
  - id: security
    title: Безопасность и секреты
    description: сканеры уязвимостей и секретов, DAST, Vault, подпись
    agent: true
  - id: containers
    title: Контейнеры и реестры
    description: Docker, Podman, образы, реестры, Dockerfile
    agent: true
  - id: git-ci
    title: Git и CI
    description: GitHub, GitLab, pre-commit, GitHub Actions, история
    agent: true
  - id: build
    title: Сборка и рантаймы
    description: версии рантаймов, линтеры, установщики, бенчмарки
    agent: true
  - id: ai-agents
    title: AI-агенты
    description: opencode, MCP, память агентов, песочницы, защита от опасных команд
    agent: true
  - id: docs-work
    title: Документы и трекеры
    description: Markdown, PDF/Office, Jira и Confluence
    agent: true
  - id: base
    title: База
    description: системные пакеты и утилиты, которые агент знает без подсказки
    agent: false
  - id: gui-desktop
    title: GUI и железо
    description: графические приложения, шрифты, аудио, диагностика железа
    agent: false

# --- Домен по умолчанию для роли ------------------------------------------
# Роли-движки (binaries, go_apps, pipx_apps, opencode, skills, github_deb)
# сюда не входят: они не ставят собственных утилит.
toolbox_role_domains:
  ai_tools: ai-agents
  atlassian: docs-work
  audio: gui-desktop
  base: base
  cargo_apps: build
  clickhouse: databases
  craft: gui-desktop
  dast: security
  docker: containers
  ebpf: observability
  fuzz: security
  git: git-ci
  guardrails: ai-agents
  hardware: gui-desktop
  iac: iac-cloud
  kubernetes: kubernetes
  markdown: docs-work
  monitoring: observability
  network: network
  nora: containers
  opencode: ai-agents
  postgres: databases
  runtimes: build
  secrets: security
  shell: search-files
  skills: ai-agents

