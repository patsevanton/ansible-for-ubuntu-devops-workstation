---
# ============================================================================
# ansible-for-ubuntu-devops-workstation
#
# Установка DevOps-окружения на локальный ноутбук с Ubuntu 26.04 (resolute).
#
# Запуск (пароль sudo вводит сам пользователь):
#   ansible-playbook -K playbook.yml
#   ansible-playbook -K playbook.yml -e binaries_update=true  # обновить бинарники
#
# Структура — стандартная для Ansible-проекта:
#   ansible.cfg        — настройки (инвентарь, путь к ролям)
#   inventory/         — инвентарь (localhost, локальное подключение)
#   group_vars/all.yml — общие переменные
#   roles/             — роли по доменам
#
# Версии инструментов не фиксируются: ставится актуальное на момент запуска.
# ============================================================================
- name: DevOps-окружение на Ubuntu-ноутбуке
  hosts: localhost
  gather_facts: true
  become: false          # системные шаги включают become: true внутри ролей
  any_errors_fatal: true

  roles:
    # base ставится всегда (нужен для --tags): базовые пакеты и каталоги.
    - role: base
      tags: [base, always]
    - role: git
      tags: [git]
    # nora идёт до docker: она только выставляет docker_registry_mirrors,
    # а роль docker рендерит /etc/docker/daemon.json уже с зеркалом. Так
    # у файла один владелец и Docker не перезапускается дважды за прогон.
    - role: nora
      tags: [nora]
    - role: docker
      tags: [docker]
    - role: kubernetes
      tags: [kubernetes]
    - role: iac
      tags: [iac]
    - role: postgres
      tags: [postgres]
    # clickhouse идёт после postgres: это ещё один клиент СУБД, но из
    # отдельного apt-репозитория (clickhouse-client + RootCA Yandex Cloud).
    - role: clickhouse
      tags: [clickhouse]
    - role: runtimes
      tags: [runtimes]
    - role: secrets
      tags: [secrets]
    # dast идёт после docker: ZAP ставится официальным Docker-образом,
    # а не бинарником. Остальные сканеры — бинарник/pipx/apt.
    - role: dast
      tags: [dast]
    # fuzz идёт после runtimes: Jazzer требует Java, libFuzzer — clang.
    # API-фаззинг по спецификации остаётся в dast (EvoMaster, schemathesis).
    - role: fuzz
      tags: [fuzz]
    - role: shell
      tags: [shell]
    - role: network
      tags: [network]
    - role: ebpf
      tags: [ebpf]
    - role: opencode
      tags: [opencode]
    - role: ai_tools
      tags: [ai-tools]
    - role: skills
      tags: [skills]
    - role: audio
      tags: [audio]
    # craft — офисные GUI-приложения ArtCraft (WordCraft, GridCraft, DeckCraft).
    # По умолчанию выключены флагами: роль ничего не делает без -e.
    - role: craft
      tags: [craft]
    # markdown — GUI-редакторы Zettlr и MarkText, ставятся всегда.
    - role: markdown
      tags: [markdown]
    - role: hardware
      tags: [hardware]
    - role: guardrails
      tags: [guardrails]
    - role: monitoring
      tags: [monitoring]

  post_tasks:
    - name: Проверить работу установленных утилит
      ansible.builtin.command: "{{ item }}"
      register: verify_result
      changed_when: false
      failed_when: false
      # Проверка версий безопасна и должна работать в --check: иначе dry-run
