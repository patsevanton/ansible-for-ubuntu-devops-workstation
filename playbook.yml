        - "{{ bin_dir }}/pdf2md --version"
        - "{{ bin_dir }}/pdfcli --help"
      loop_control:
        label: "{{ item }}"

    # Приложения ArtCraft (роль craft) ставятся только по флагам, поэтому их
    # проверяем отдельным проходом и подмешиваем результаты в общий отчёт.
    # --version у них есть и у GUI-бинарника, и у CLI, окно не открывается.
    - name: Собрать пути приложений ArtCraft, включённых флагами
      ansible.builtin.set_fact:
        craft_verify_paths: >-
          {{ (['/usr/bin/wordcraft'] if wordcraft_install | default(false) | bool else [])
             + (['/usr/bin/gridcraft'] if gridcraft_install | default(false) | bool else [])
             + (['/usr/bin/deckcraft'] if deckcraft_install | default(false) | bool else []) }}
      check_mode: false

    - name: Проверить работу приложений ArtCraft
      ansible.builtin.command: "{{ item }} --version"
      register: craft_verify_result
      changed_when: false
      failed_when: false
      check_mode: false
      loop: "{{ craft_verify_paths }}"
      when: craft_verify_paths | length > 0

    - name: Проверить наличие бинарников и приложений без флага версии
      ansible.builtin.stat:
        path: "{{ item }}"
      register: extra_binaries_check
      # В обычном прогоне отсутствие файла — ошибка. В --check на чистой
      # машине почти всё отсутствует, поэтому там только фиксируем факт.
      failed_when: not extra_binaries_check.stat.exists and not ansible_check_mode
      # stat только читает ФС — в --check он тоже должен отработать.
      check_mode: false
      loop:
        - "{{ bin_dir }}/kubectx"
        - "{{ bin_dir }}/kube-prompt"
        - "{{ bin_dir }}/static-tcpdump"
        - "{{ bin_dir }}/kubefwd"
        - "{{ bin_dir }}/gitlabcloner"
        - "{{ pipx_bin_dir }}/rkn-check"
        - "{{ pipx_bin_dir }}/showcert"
        - /opt/Headlamp/headlamp
        - /usr/bin/radar-desktop
        - /usr/bin/hushmic
        - "{{ bin_dir }}/kubeview"
        - "{{ helm_diff_plugin_dir }}"
        - "{{ helm_secrets_plugin_dir }}"
        - "{{ bin_dir }}/capacitor"
        - "{{ bin_dir }}/kubebox"
        - "{{ bin_dir }}/gitlab-terraform-manager"
        - /opt/dependency-check/bin/dependency-check.sh
        - "{{ bin_dir }}/kopilot"
        - "{{ pipx_bin_dir }}/kptop"
        - /usr/bin/klustr
        - /usr/bin/kubiki
        - /usr/bin/dbx
        - /usr/bin/OmnySSH
      loop_control:
        label: "{{ item }}"

    # У EvoMaster нет короткого --version, а --help печатает сотни строк в
    # отчёт. Поэтому проверяем обёртку и jar отдельным stat-проходом; при
    # -e dast_evomaster_install=false его пропускаем.
    - name: Проверить наличие EvoMaster
      ansible.builtin.stat:
        path: "{{ item }}"
      register: dast_evomaster_check
      failed_when: not dast_evomaster_check.stat.exists and not ansible_check_mode
      check_mode: false
      loop:
        - "{{ bin_dir }}/evomaster"
        - "{{ dast_evomaster_jar | default('/opt/evomaster/evomaster.jar') }}"
      loop_control:
        label: "{{ item }}"
      when: dast_evomaster_install | default(false) | bool

    # --- Удаление pitwall ----------------------------------------------------
    # pitwall не используется (issue о вводе русских букв:
    # https://github.com/quanticstudios/pitwall/issues/127). Удаляем бинарник,
    # ярлык, иконку, конфиг и состояние, чтобы не плодить мёртвый инструмент.
    - name: Остановить демон pitwall, если запущен
      ansible.builtin.command: "{{ bin_dir }}/pitwall daemon stop"
      register: pitwall_daemon_stop
      changed_when: false
      failed_when: false

    - name: Удалить файлы pitwall
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ bin_dir }}/pitwall"
        - /usr/share/applications/pitwall.desktop
        - /usr/share/icons/hicolor/scalable/apps/pitwall.svg
        - /usr/share/icons/hicolor/scalable/apps/pitwall.png
        - /usr/share/icons/hicolor/48x48/apps/pitwall.png
        - /usr/share/icons/hicolor/256x256/apps/pitwall.png
      loop_control:
        label: "{{ item }}"

    - name: Удалить каталоги конфига и состояния pitwall
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ home_dir }}/.config/pitwall"
        - "{{ home_dir }}/.local/state/pitwall"
      loop_control:
        label: "{{ item }}"

    - name: Удалить сокет pitwall из XDG_RUNTIME_DIR
      ansible.builtin.file:
        path: "{{ ansible_facts['env'].get('XDG_RUNTIME_DIR', '') }}/pitwall"
        state: absent
      when: ansible_facts['env'].get('XDG_RUNTIME_DIR', '') | length > 0

    - name: Обновить кэш иконок после удаления pitwall
      become: true
      ansible.builtin.command: gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor
      changed_when: false
      failed_when: false

    # --- Удаление утилит, от которых отказались -----------------------------
    # Причина отказов — в not-install.md: VictoriaMetrics (кроме
    # vmalert-tool) не нужна без локального скрейпа метрик, auto-cpufreq —
    # не нужен. Чистим всё, что могло остаться от промежуточных прогонов
    # плейбука или ручной установки, чтобы не плодить мёртвые инструменты.

    # VictoriaMetrics: single-node бинарник (стоял в ранней версии роли
    # monitoring) и каталог данных, который VM создаёт при запуске.
    - name: Удалить бинарник victoria-metrics (оставили только vmalert-tool)
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ bin_dir }}/victoria-metrics"
        - "{{ home_dir }}/victoria-metrics-data"
      loop_control:
        label: "{{ item }}"

    # auto-cpufreq: удаляем pipx-окружение (шим + venv). `pipx uninstall`
    # завершается с кодом 1 и печатает «Nothing to uninstall», если пакета нет —
    # это норма для идемпотентного прогона, поэтому не считаем ошибкой.
    - name: Удалить pipx-окружение auto-cpufreq (не нужен)
      ansible.builtin.command:
        cmd: "{{ pipx_executable }} uninstall auto-cpufreq"
      environment:
        PIPX_HOME: "{{ pipx_home }}"
        PIPX_BIN_DIR: "{{ pipx_bin_dir }}"
        PIPX_DEFAULT_PYTHON: "{{ pipx_python }}"
      register: autocpufreq_uninstall
      failed_when: false
      changed_when: >-
        autocpufreq_uninstall.rc == 0

    # Конфиг и systemd-юнит создаёт `auto-cpufreq --install` при ручной
    # установке сервиса — убираем и их, чтобы не оставалось хвостов.
    - name: Удалить файлы auto-cpufreq
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ pipx_bin_dir }}/auto-cpufreq"
        - /etc/auto-cpufreq.conf
        - /etc/systemd/system/auto-cpufreq.service
      loop_control:
        label: "{{ item }}"

    - name: Итог — версии установленных утилит
      ansible.builtin.debug:
        msg: >-
          {{ item.item }} ->
          {{ (item.stdout_lines | default([]) | join(' '))
             or (item.stderr_lines | default([]) | join(' '))
             or 'НЕ РАБОТАЕТ' }}
      loop: "{{ verify_result.results + (craft_verify_result.results | default([])) }}"
      loop_control:
        label: "{{ item.item }}"

    # --- Отчёт о версиях ---------------------------------------------------
    # report.json — машиночитаемый снимок версий (его удобно диффить между
    # ноутбуками). Лежит в ~/.local/state/devops-playbook и не попадает в
    # репозиторий.

    # git-модуль Ansible умеет только clone/checkout, а нужен rev-parse.
    - name: Узнать commit плейбука для отчёта  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "git -C {{ playbook_dir }} rev-parse --short HEAD"
      register: playbook_commit
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Создать каталог состояния
      ansible.builtin.file:
        path: "{{ devops_state_dir }}"
        state: directory
        mode: "0755"

    - name: Собрать отчёт по утилитам с флагом версии
      ansible.builtin.set_fact:
        devops_report_tools: >-
          {{ (devops_report_tools | default([])) + [ {
            'command': item.item,
            'ok': (item.rc | default(1)) == 0,
            'output': (item.stdout_lines | default([]) | first | default(''))
                      or (item.stderr_lines | default([]) | first | default(''))
          } ] }}
      loop: "{{ verify_result.results + (craft_verify_result.results | default([])) }}"
      loop_control:
        label: "{{ item.item }}"
      check_mode: false

    - name: Собрать отчёт по файлам без флага версии
      ansible.builtin.set_fact:
        devops_report_files: >-
          {{ (devops_report_files | default([])) + [ {
            'path': item.item,
            'ok': item.stat.exists
          } ] }}
      loop: "{{ extra_binaries_check.results }}"
      loop_control:
        label: "{{ item.item }}"
      check_mode: false

    - name: Прочитать state бинарников для отчёта
      ansible.builtin.slurp:
        src: "{{ binaries_state_file }}"
      register: binaries_state_report
      failed_when: false
      check_mode: false

    # ansible_run_tags — не обычный list, поэтому full_run сравниваем через join.
    - name: Записать отчёт о версиях
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: >-
          {{ {
            'generated_at': ansible_facts['date_time']['iso8601'],
            'host': ansible_facts['hostname'],
            'distribution': ansible_facts['distribution'] ~ ' '
                            ~ ansible_facts['distribution_version'] ~ ' ('
                            ~ ansible_facts['distribution_release'] ~ ')',
            'kernel': ansible_facts['kernel'],
            'user': ansible_facts['user_id'],
            'playbook_commit': playbook_commit.stdout | default('unknown', true) | trim,
            'full_run': ((ansible_run_tags | default(['all'], true) | join(',')) == 'all')
                        and ((ansible_skip_tags | default([], true) | join(',')) == ''),
            'run_tags': ansible_run_tags | default(['all'], true),
            'skip_tags': ansible_skip_tags | default([], true),
            'tools': devops_report_tools | default([]),
            'files': devops_report_files | default([]),
            'binaries': (binaries_state_report.content | b64decode | from_json)
                        if binaries_state_report.content is defined else {}
          } | to_nice_json }}
      changed_when: false
